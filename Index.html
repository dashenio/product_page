<!DOCTYPE html>

<html lang="pt">
    <head>
        <meta charset="utf-8">
        <title>Product Page</title>
        <meta name="description" content="A page built to test knowledge on HTML/CSS/JS.">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>

        <header class="navbar">

            <div class="nav-esquerda">

                <a href="index.html">

                    <img id="logo" src="images\logo.svg" alt="Sneakers shop logo">

                </a>

                <nav id="links-navbar">
                    <a href="">Collections</a>
                    <a href="">Men</a>
                    <a href="">Women</a>
                    <a href="">About</a>
                    <a href="">Contact</a>
                </nav>

            </div>

            <div class="nav-direita">
                <img id="carrinho" src="images/icon-cart.svg" alt="" >
                <img id="avatar" src="images/image-avatar.png" alt="" >
            </div>    

        </header>

        <hr>

        <main class="conteudo">

            <section class="imagens-produto">

                <!-- The Modal/Lightbox -->
                <div id="myModal" class="modal">

                    <div class="modal-content">

                        <span class="close cursor" onclick="closeModal()">
                            <img src="images/icon-close.svg">
                        </span>

                        <div class="mySlides">
                            <img src="images/image-product-1.jpg" style="width:100%">
                        </div>
                        <div class="mySlides">
                            <img src="images/image-product-2.jpg" style="width:100%">
                        </div>
                        <div class="mySlides">
                            <img src="images/image-product-3.jpg" style="width:100%">
                        </div>
                        <div class="mySlides">
                            <img src="images/image-product-4.jpg" style="width:100%">
                        </div>

                        <a class="prev" onclick="plusSlides(-1)"><img src="images/icon-previous.svg"></a>
                        <a class="next" onclick="plusSlides(1)"><img src="images/icon-next.svg"></a>

                        <div class="modal-miniaturas">
                            <div class="item">
                                <img class="demo" src="images/image-product-1-thumbnail.jpg" onclick="currentSlide(1)">
                            </div>
                            <div class="item">
                                <img class="demo" src="images/image-product-2-thumbnail.jpg" onclick="currentSlide(2)">
                            </div>
                            <div class="item">
                                <img class="demo" src="images/image-product-3-thumbnail.jpg" onclick="currentSlide(3)">
                            </div>
                            <div class="item">
                                <img class="demo" src="images/image-product-4-thumbnail.jpg" onclick="currentSlide(4)">
                            </div>
                        </div>

                    </div> 
                </div>

            <div class="foto-principal-pagina">
                <img src="images/image-product-1.jpg" onclick="openModal();currentSlide(1)" class="imagem-destaque">
            </div>

            <div class="linha">
                <div class="item">
                    <a href="#image1">
                    <img src="images/image-product-1-thumbnail.jpg" 
                         onclick="openModal();currentSlide(1)" class="hover-shadow">
                    </a>
                </div>
                <div class="item">
                    <a href="#image2">
                    <img src="images/image-product-2-thumbnail.jpg" 
                         onclick="openModal();currentSlide(2)" class="hover-shadow">
                    </a>
                </div>
                <div class="item">
                    <a href="#image3">
                    <img src="images/image-product-3-thumbnail.jpg" 
                         onclick="openModal();currentSlide(3)" class="hover-shadow">
                    </a>
                
                </div>

                <div class="item">
                    <a href="#image4">
                    <img src="images/image-product-4-thumbnail.jpg" 
                         onclick="openModal();currentSlide(4)" class="hover-shadow">
                    </a>
                </div>
            </div>
            
            

        </section>
        <section class="card-produto">

            <span id="fabricante">SNEAKER COMPANY</span>
            <h1>Fall Limited Edition Sneakers</h1>

            <p class="descricao">
                These low-profile sneakers are your perfect casual wear companion. 
                Featuring a durable rubber outer sole, they’ll withstand everything 
                the weather can offer.
            </p>

            <div class="container-preco">

                <div class="preco">
                <h2 id="preco-atual">125</h2> 
                <span id="desconto">50%</span>
            </div>
            
            <p id="preco-anterior">250</p>

            </div>

            <div class="add-cart">
                <div class="qtd">
                    <div id="menos" onClick="retirar()">
                        <img  src="images/icon-minus.svg">
                    </div>
                    
                    <p id="numero">0</p>

                    <div id="mais" onClick="adicionar()">
                        <img src="images/icon-plus.svg">
                    </div>     
                </div>
                <button id="main-botao">
                    <img id="img-cart-botao" src="images/icon-cart.svg">
                    <p>Add to cart</p>
                </button>       
            </div>

            

        </section>
            
    </main>       
        
        <script src="script.js" async defer></script>
    </body>
</html>
